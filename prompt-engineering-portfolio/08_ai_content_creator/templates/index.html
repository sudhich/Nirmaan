<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Content Creator</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
<header>
<div class="badge">PROMPT ENGINEERING PORTFOLIO</div>
<h1>AI Content Creator</h1>
<p>Create professional AI-generated content with carefully designed prompts.</p>
</header>

<section class="card">
<label for="topic">Topic</label>
<textarea id="topic" placeholder="Example: How Generative AI is changing education"></textarea>

<label for="content_type">Content Type</label>
<select id="content_type">
<option>LinkedIn Post</option>
<option>Blog</option>
<option>Email</option>
<option>Social Media Caption</option>
<option>Marketing Copy</option>
<option>Summary</option>
</select>

<button onclick="generateContent()">Generate Content</button>
<p id="status"></p>
</section>

<section class="result-card">
<h2>Generated Content</h2>
<div id="result">Your generated content will appear here.</div>
</section>
</div>

<script>
async function generateContent(){
    const topic = document.getElementById("topic").value.trim();
    const content_type = document.getElementById("content_type").value;
    const status = document.getElementById("status");
    const result = document.getElementById("result");

    if(!topic){
        status.textContent = "Please enter a topic.";
        return;
    }

    status.textContent = "Generating...";
    result.textContent = "";

    try{
        const response = await fetch("/generate", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({topic, content_type})
        });

        const data = await response.json();

        if(data.success){
            result.textContent = data.content;
            status.textContent = "Content generated successfully.";
        }else{
            status.textContent = data.error || "Something went wrong.";
        }
    }catch(error){
        status.textContent = "Could not connect to the server.";
    }
}
</script>
</body>
</html>
